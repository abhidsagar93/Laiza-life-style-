// ---------------------------------------------------------------------
// CHARTS (Chart.js) — instance registry so re-renders don't leak/crash
// ---------------------------------------------------------------------
const chartInstances = {};
function drawChart(canvasId, type, labels, datasets, extraOptions){
  const canvas = document.getElementById(canvasId);
  if (!canvas || typeof Chart === "undefined") return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); delete chartInstances[canvasId]; }
  chartInstances[canvasId] = new Chart(canvas, {
    type, data: { labels, datasets },
    options: Object.assign({
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: type === "doughnut" ? {} : { y: { beginAtZero: true, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } },
    }, extraOptions || {})
  });
}
// Builds a { labels: [...last N days...], series: {key: [values...]} } from any list of
// {date, ...} rows, using a caller-supplied reducer per bucket.
function lastNDaysSeries(rows, days, initFn, reduceFn){
  const buckets = {};
  const labels = [];
  for (let i = days-1; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toLocaleDateString('en-CA');
    labels.push(d.toLocaleDateString('en-US', { month:'short', day:'numeric' }));
    buckets[key] = initFn();
  }
  rows.forEach(r=>{
    const key = new Date(r.date).toLocaleDateString('en-CA');
    if (buckets[key] !== undefined) reduceFn(buckets[key], r);
  });
  return { labels, values: Object.values(buckets) };
}

window.addEventListener("hashchange", () => { state.route = location.hash || "#/home"; render(); window.scrollTo(0,0); });
function go(route){
  if (location.hash === route){ state.route = route; render(); window.scrollTo(0,0); return; }
  location.hash = route;
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
async function boot(){
  renderShell(loadingScreen());
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if (session) { await loadProfileBundle(); await loadNotifications(); }
  await Promise.all([loadCategories(), loadStores(), loadCoupons(), loadSettings(), loadFeaturedProducts()]);
  if (state.profile && state.profile.role === "customer") await loadCart();
  setupRealtime();
  state.route = location.hash || "#/home";
  render();

  sb.auth.onAuthStateChange(async (event, session) => {
    state.session = session;
    if (event === "SIGNED_IN") {
      await loadProfileBundle();
      if (!state.profile){
        // The session can take a beat to fully propagate right after sign-in — retry once.
        await new Promise(r=>setTimeout(r,800));
        await loadProfileBundle();
      }
      if (!state.profile){
        toast(`Couldn't load your account${state.lastProfileLoadError?': '+state.lastProfileLoadError:''}. Please try logging in again.`,"err");
        return;
      }
      if (state.profile.is_active === false){
        toast("Your account has been suspended. Contact support if you think this is a mistake.","err");
        state.profile = null;
        await sb.auth.signOut();
        return;
      }
      await loadCart();
      await loadNotifications();
      setupRealtime();
      if (!state.suppressAuthRedirect) go(state.profile.role === "customer" ? "#/home" : dashboardRoute());
    }
    if (event === "SIGNED_OUT") {
      state.profile = null; state.store = null; state.dp = null; state.cart = []; state.orders = []; state.notifications = [];
      if (state.realtimeChannel) { sb.removeChannel(state.realtimeChannel); state.realtimeChannel = null; }
      go("#/login");
    }
  });
}

function playBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
    setTimeout(()=>{
      const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.type = "sine"; osc2.frequency.value = 1046;
      gain2.gain.setValueAtTime(0.25, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc2.start(); osc2.stop(ctx.currentTime + 0.35);
    }, 180);
  } catch(e) { /* audio not available, fail silently */ }
}
let prevStoreNewOrderCount = null, prevDpAvailableTripCount = null;
function checkForNewAlertSounds(){
  if (!state.profile) return;
  if (state.profile.role === "store_owner" && state.store){
    const count = state.orders.filter(o=>o.status==="placed" && o.store_id===state.store.id).length;
    if (prevStoreNewOrderCount !== null && count > prevStoreNewOrderCount) playBeep();
    prevStoreNewOrderCount = count;
  }
  if (state.profile.role === "delivery_partner"){
    const count = state.masterOrders.filter(m=>m.status==="placed" && !m.delivery_partner_id && masterAllReady(m)).length;
    if (prevDpAvailableTripCount !== null && count > prevDpAvailableTripCount) playBeep();
    prevDpAvailableTripCount = count;
  }
}
function setupRealtime(){
  if (state.realtimeChannel) { sb.removeChannel(state.realtimeChannel); state.realtimeChannel = null; }
  if (!state.profile) return;
  const channel = sb.channel("tp-live-" + state.profile.id)
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, async () => {
      await loadOrders();
      if (state.route.startsWith("#/admin-")) await loadAdminData();
      checkForNewAlertSounds();
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "master_orders" }, async () => {
      await loadMasterOrders();
      if (state.route.startsWith("#/admin-")) await loadAdminData();
      checkForNewAlertSounds();
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${state.profile.id}` }, async () => {
      await loadNotifications();
      render();
    })
    .subscribe();
  state.realtimeChannel = channel;
}

async function loadProfileBundle(){
  if (!state.session || !state.session.user){ state.lastProfileLoadError = "No active session"; return; }
  const uid = state.session.user.id;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", uid).single();
  if (error) { console.error(error); state.lastProfileLoadError = error.message || JSON.stringify(error); return; }
  state.lastProfileLoadError = null;
  state.profile = profile;
  if (profile.role === "store_owner") {
    const { data: store } = await sb.from("stores").select("*").eq("owner_id", uid).maybeSingle();
    state.store = store || null;
  }
  if (profile.role === "delivery_partner") {
    const { data: dp } = await sb.from("delivery_partners").select("*").eq("id", uid).maybeSingle();
    state.dp = dp || null;
  }
  const { data: addresses } = await sb.from("addresses").select("*").eq("user_id", uid).order("is_default", {ascending:false});
  state.addresses = addresses || [];
}
async function loadCategories(){
  const { data } = await sb.from("categories").select("*").eq("is_active", true).order("sort_order");
  state.categories = data || [];
}
async function loadStores(){
  const { data } = await sb.from("stores").select("*, categories(name)").eq("status","approved").order("created_at",{ascending:false});
  state.stores = data || [];
}
async function loadFeaturedProducts(){
  // Best sellers first (real delivered-order sales data); if the marketplace has no sales yet,
  // this just falls back to newest listings so the section is never empty.
  const { data } = await sb.from("product_sales_stats").select("*").order("total_sold",{ascending:false}).order("created_at",{ascending:false}).limit(10);
  state.featuredProducts = data || [];
  await hydrateAvailability(state.featuredProducts);
}
async function loadCoupons(){
  const { data } = await sb.from("coupons").select("*, stores(name)").order("created_at",{ascending:false});
  state.coupons = data || [];
}
async function loadSettings(){
  const { data } = await sb.from("platform_settings").select("*").eq("id",1).maybeSingle();
  if (data) state.settings = data;
}
async function loadCart(){
  if (!state.profile) { state.cart = []; return; }
  const { data } = await sb.from("cart_items").select("*, products(*, stores(name, delivery_fee, min_order, id, lat, lng))").eq("user_id", state.profile.id);
  state.cart = data || [];
}
async function loadOrders(){
  if (!state.profile) return;
  let q = sb.from("orders").select("*, stores(name, image_url, owner_id, address_line, lat, lng, delivery_time_mins), order_items(*), delivery_partners(id, profiles(full_name, phone)), customer:profiles!orders_customer_id_fkey(full_name, phone)").order("placed_at",{ascending:false});
  if (state.profile.role === "customer") q = q.eq("customer_id", state.profile.id);
  if (state.profile.role === "store_owner" && state.store) q = q.eq("store_id", state.store.id);
  if (state.profile.role === "delivery_partner") q = q.or(`delivery_partner_id.eq.${state.profile.id},status.eq.ready_for_pickup`);
  const { data, error } = await q.limit(300);
  if (error) console.error(error);
  state.orders = data || [];
}
async function loadMasterOrders(){

function renderShell(html){
  const active = document.activeElement;
  const shouldRestore = active && $app.contains(active) && active.id && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
  const activeId = shouldRestore ? active.id : null;
  const selStart = shouldRestore && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = shouldRestore && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  const scrollY = window.scrollY;
  $app.innerHTML = html;
  if (activeId){
    const el = document.getElementById(activeId);
    if (el){
      el.focus({ preventScroll: true });
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
  window.scrollTo(0, scrollY);
}

// Prints ONLY the given section, not the rest of the page. Works by temporarily marking
// every sibling along the path from the section up to <body> as non-printing, then undoing
// it right after the print dialog closes.
function printSection(sectionId, reportTitle){
  const section = document.getElementById(sectionId);
  if (!section){ printPage(reportTitle); return; }

  const hidden = [];
  let node = section;
  while (node && node !== document.body){
    const parent = node.parentElement;
    if (!parent) break;
    Array.from(parent.children).forEach(sib=>{
      if (sib !== node && !sib.classList.contains("no-print")){
        sib.classList.add("no-print");
        hidden.push(sib);
      }
    });
    node = parent;
  }

  // Give this section its own printed header, since the page's usual one is now hidden
  const header = document.createElement("div");
  header.className = "print-header";
  header.style.display = "none";
  header.innerHTML = `<h1 style="font-size:20px;font-weight:800;margin:0">TownParcel — ${escapeHtml(reportTitle)}</h1><div style="font-size:12px;color:#666;margin-top:2px">Printed ${fmtDate(new Date().toISOString())}</div>`;
  section.prepend(header);

  const cleanup = ()=>{
    hidden.forEach(el=>el.classList.remove("no-print"));
    header.remove();
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  window.print();
  // Safety net for browsers that don't reliably fire afterprint
  setTimeout(()=>{ if (document.body.contains(header)) cleanup(); }, 1500);
}
function loadPdfLib(cb){
  if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return cb();
  const s1 = document.createElement('script');
  s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
    s2.onload = cb;
    s2.onerror = () => toast('Could not load PDF generator — check your connection.','err');
    document.head.appendChild(s2);
  };
  s1.onerror = () => toast('Could not load PDF generator — check your connection.','err');
  document.head.appendChild(s1);
}
function moneyPdf(n){ return "Rs. " + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
function buildStatementPdf(title, orders){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const paid = orders.filter(o=>o.store_paid_at);
  const pending = orders.filter(o=>!o.store_paid_at);
  const paidTotal = paid.reduce((s,o)=>s+Number(o.store_payout||0),0);
  const pendingTotal = pending.reduce((s,o)=>s+Number(o.store_payout||0),0);

  doc.setFontSize(16); doc.setTextColor(21,138,70);
  doc.text("TownParcel", 14, 18);
  doc.setFontSize(11); doc.setTextColor(80,80,80);
  doc.text(`Statement — ${title}`, 14, 25);
  doc.setFontSize(9); doc.setTextColor(130,130,130);
  doc.text(`Generated ${fmtDate(new Date().toISOString())}`, 14, 30);

  doc.setFontSize(10);
  doc.setTextColor(180,120,20);
  doc.text(`Pending Settlement: ${moneyPdf(pendingTotal)}`, 14, 40);
  doc.setTextColor(21,138,70);
  doc.text(`Paid to Date: ${moneyPdf(paidTotal)}`, 90, 40);

  const rows = orders.map(o=>[
    fmtDate(o.placed_at), "#"+o.order_number, moneyPdf(o.subtotal),
    Number(o.commission_amount)>0?'-'+moneyPdf(o.commission_amount):'—',
    Number(o.store_delivery_share)>0?'-'+moneyPdf(o.store_delivery_share):'—',
    Number(o.tax_amount)>0?'+'+moneyPdf(o.tax_amount):'—',
    moneyPdf(o.store_payout),
    o.store_paid_at ? `Paid ${fmtDate(o.store_paid_at)}` : "Pending",
  ]);
  doc.autoTable({
    startY: 46,
    head: [["Date","Order No","Invoice","Commission","Delivery Fee","GST","Net Payout","Settlement"]],
    body: rows,
    styles: { fontSize: 7, cellPadding: 2 },
    headStyles: { fillColor: [21,138,70] },
    margin: { left: 14, right: 14 },
  });
  return doc;
}
async function shareStatement(title, orders){
  loadPdfLib(async ()=>{
    try {
      const doc = buildStatementPdf(title, orders);
      const fileName = `TownParcel-Statement-${title.replace(/[^a-z0-9]+/gi,'-')}.pdf`;
      const blob = doc.output("blob");
      const file = new File([blob], fileName, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ title: `TownParcel Statement — ${title}`, files: [file] });
      } else if (navigator.share){
        // Can't share files on this browser — fall back to downloading, then share the file manually
        doc.save(fileName);
        toast("PDF downloaded — attach it from your Files/Downloads to share.");
      } else {
        doc.save(fileName);
        toast("PDF downloaded — share it from your Downloads folder.");
      }
    } catch(e){
      if (e && e.name === "AbortError") return; // user cancelled the share sheet
      toast("Could not generate the PDF.","err");
    }
  });
}

function isStoreOpenNow(s){
  if (!s.opening_time || !s.closing_time) return s.is_open !== false;
  const now = new Date();
  const cur = now.getHours()*60+now.getMinutes();
  const [oh,om] = s.opening_time.split(":").map(Number);
  const [ch,cm] = s.closing_time.split(":").map(Number);
  const open = oh*60+om, close = ch*60+cm;
  return close > open ? (cur>=open && cur<close) : (cur>=open || cur<close);
}

function slideshow(images, opts={}){
  const n = images.length;
  const perSlide = opts.perSlide || 5;
  const duration = n * perSlide;
  const slot = 100 / n;
  const visibleEnd = (slot * 0.8).toFixed(2);
  const fadeInStart = (100 - slot * 0.2).toFixed(2);
  const animName = "sw" + Math.random().toString(36).slice(2, 9);
  return `<style>@keyframes ${animName}{0%{opacity:1;}${visibleEnd}%{opacity:1;}${slot}%{opacity:0;}${fadeInStart}%{opacity:0;}100%{opacity:1;}}</style>
  <div class="slideshow shadow-card">
    ${images.map((s,i)=>`<div class="slideshow-slide" style="animation:${animName} ${duration}s infinite; animation-delay:-${i*perSlide}s;">
      <img src="${s.img}" alt="${escapeHtml(s.title||'TownParcel')}" onerror="this.parentElement.style.display='none'"/>
      ${s.title ? `<div class="slideshow-caption"><div class="font-bold text-lg sm:text-2xl">${s.title}</div><div class="text-xs sm:text-sm opacity-90">${s.sub||''}</div></div>` : ""}
    </div>`).join("")}
  </div>`;
}

function handleSearchInput(){
  clearTimeout(searchDebounceTimer);
  const q = (document.getElementById("global-search")?.value || "").trim();
  const box = document.getElementById("search-suggestions");
  if (!box) return;
  if (q.length < 2){ box.classList.add("hidden"); box.innerHTML = ""; return; }
  searchDebounceTimer = setTimeout(()=>runSearchSuggestions(q), 220);
}
async function runSearchSuggestions(q){
  const box = document.getElementById("search-suggestions");
  if (!box) return;
  const like = `%${q}%`;
  const [{data: stores}, {data: products}] = await Promise.all([
    sb.from("stores").select("id, name, image_url").eq("status","approved").ilike("name", like).limit(4),
    sb.from("products").select("id, name, image_url, price, stores!inner(status)").eq("is_available", true).eq("stores.status","approved").ilike("name", like).limit(6),
  ]);
  // Guard against a slower earlier query resolving after a newer one — always trust what's currently typed
  const current = (document.getElementById("global-search")?.value || "").trim();
  if (current !== q) return;

  const storeList = stores || [];
  const productList = products || [];

async function viewSearchResults(q){
  q = decodeURIComponent(q||"");
  const like = `%${q}%`;
  const [{data: matchedStores}, {data: matchedProducts}] = await Promise.all([
    sb.from("stores").select("*, categories(name)").eq("status","approved").ilike("name", like),
    sb.from("products").select("*, stores!inner(id, name, delivery_fee, min_order, status)").eq("is_available", true).eq("stores.status","approved").ilike("name", like).limit(40),
  ]);
  const stores = matchedStores || [];
  const products = matchedProducts || [];
  await hydrateAvailability(products);
  const nothing = !stores.length && !products.length;
  return `<div class="pt-6">
    <a href="#/stores" class="text-sm text-slate-500 flex items-center gap-1 mb-3">${icon('back','w-4 h-4')} Browse all stores</a>

}

function passwordStrength(pw){
  let s=0;
  if (pw.length>=6) s++;
  if (pw.length>=10) s++;
  if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(s,4);
}

async function submitStoreRegistration(){
  if (!document.getElementById("wiz-terms").checked || !document.getElementById("wiz-privacy").checked)
    return toast("Please accept the Terms & Conditions and Privacy Policy","err");
  const btn = document.getElementById("wiz-submit-btn");
  btn.disabled = true; btn.innerHTML = `<span class="spinner inline-block align-middle"></span> Submitting...`;
  const d = storeWiz.data;
  try {
    state.suppressAuthRedirect = true;
    const { data: authData, error: signUpErr } = await sb.auth.signUp({
      email: d.email, password: d.password,
      options: { data: { full_name: d.full_name, phone: d.phone, role: "store_owner" } }
    });
    if (signUpErr) throw signUpErr;
    await new Promise(r=>setTimeout(r,900)); // let the profile-creation trigger finish

    const uid = authData.user.id;
    const upload = async (file, bucket, profileName) => {
      if (!file) return null;
      let toUpload = file;
      try { toUpload = await optimizeImage(file, profileName || 'default'); } catch(e){ /* fall back to original */ }
      const ext = toUpload.name.split('.').pop() || OUTPUT_EXT;
      const path = `${uid}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from(bucket).upload(path, toUpload);
      if (error) throw error;
      return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    };
    const uploadPrivate = async (file, bucket) => {
      if (!file) return null;
      const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
      const path = `${uid}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from(bucket).upload(path, file);
      if (error) throw error;
      return path; // kept as a storage path, not a public URL, since the bucket is private
    };
    const [logoUrl, bannerUrl, shopPhotoUrl] = await Promise.all([
      upload(storeWiz.files.logo, "store-images", "logo"),
      upload(storeWiz.files.banner, "store-images", "banner"),
      upload(storeWiz.files.shopPhoto, "store-images", "banner"),
    ]);
    const [idProofPath, bizProofPath] = await Promise.all([
      uploadPrivate(storeWiz.files.idProof, "kyc-documents"),
      uploadPrivate(storeWiz.files.bizProof, "kyc-documents"),
    ]);

    const { data: store, error: storeErr } = await sb.from("stores").insert({
      owner_id: uid, name: d.store_name, category_id: d.category_id || null, description: d.description,
      opening_time: d.opening_time, closing_time: d.closing_time,
      address_line: d.address_line, landmark: d.landmark, area: d.area, city: d.city, state: d.state, pincode: d.pincode,
      lat: storeWiz.geo?.lat, lng: storeWiz.geo?.lng,
      logo_url: logoUrl, image_url: bannerUrl, shop_photo_url: shopPhotoUrl,
      status: "pending",
    }).select().single();
    if (storeErr) throw storeErr;

    const { error: kycErr } = await sb.from("store_kyc").insert({
      store_id: store.id, gst_number: d.gst_number || null, business_license_number: d.business_license_number || null,
      bank_account_holder: d.bank_account_holder, bank_name: d.bank_name, bank_account_number: d.bank_account_number,
      bank_ifsc: d.bank_ifsc, upi_id: d.upi_id || null, owner_id_proof_url: idProofPath, business_proof_url: bizProofPath,
    });

    storeWiz.step = "success";
    state.suppressAuthRedirect = false;
    await loadProfileBundle();
    render();
  } catch (e) {
    state.suppressAuthRedirect = false;
    toast(e.message, "err");
    btn.disabled = false; btn.textContent = "Submit for Approval";
  }
}

async function hydrateAvailability(products){
  const ids = [...new Set((products||[]).filter(p=>p && p.id).map(p=>p.id))];
  if (!ids.length) return products;
  const { data } = await sb.rpc("products_availability", { p_ids: ids });
  const map = {};
  (data||[]).forEach(r=>{ map[r.product_id] = r.available_stock; });
  (products||[]).forEach(p=>{ if (p && p.id in map) p.available_stock = map[p.id]; });
  return products;
}

async function addToCart(productId, storeId){
  if (!state.profile){ toast("Please log in to add items to cart.","err"); go("#/login"); return; }
  if (state.profile.role !== "customer"){ toast("Only customer accounts can shop.","err"); return; }
  const [{ data: prod }, { data: avail }] = await Promise.all([
    sb.from("products").select("is_available, name").eq("id", productId).maybeSingle(),
    sb.rpc("product_available_stock", { p_product_id: productId }),
  ]);
  if (!prod || !prod.is_available || Number(avail||0) <= 0){ toast(`${prod?.name||"This item"} is out of stock right now.`,"err"); render(); return; }
  const { error } = await sb.from("cart_items").upsert({ user_id: state.profile.id, product_id: productId, quantity: 1 }, { onConflict: "user_id,product_id" });
  if (error) return toast(error.message,"err");
  await loadCart(); render();
  toast("Added to cart");
}
async function buyNow(productId, storeId){
  if (!state.profile){ toast("Please log in to continue.","err"); go("#/login"); return; }
  if (state.profile.role !== "customer"){ toast("Only customer accounts can shop.","err"); return; }
  const already = state.cart.find(c=>c.product_id===productId);
  if (!already){
    const [{ data: prod }, { data: avail }] = await Promise.all([
      sb.from("products").select("is_available, name").eq("id", productId).maybeSingle(),
      sb.rpc("product_available_stock", { p_product_id: productId }),
    ]);
    if (!prod || !prod.is_available || Number(avail||0) <= 0){ toast(`${prod?.name||"This item"} is out of stock right now.`,"err"); render(); return; }
    const { error } = await sb.from("cart_items").upsert({ user_id: state.profile.id, product_id: productId, quantity: 1 }, { onConflict: "user_id,product_id" });
    if (error) return toast(error.message,"err");
    await loadCart();
  }
  go("#/checkout");
}
async function changeQty(productId, delta){
  const item = state.cart.find(c=>c.product_id===productId);
  if (!item) return;
  const newQty = item.quantity + delta;
  if (newQty <= 0) await sb.from("cart_items").delete().eq("id", item.id);
  else await sb.from("cart_items").update({ quantity: newQty }).eq("id", item.id);
  await loadCart(); render();
}

let appliedCoupon = null;
function cartByStore(){
  const groups = {};
  state.cart.forEach(c=>{
    const s = c.products.stores;
    if (!groups[s.id]) groups[s.id] = { store: s, items: [], subtotal: 0 };
    groups[s.id].items.push(c);
    groups[s.id].subtotal += c.products.price * c.quantity;
  });
  return Object.values(groups);
}
function deliveryChargeForStoreCount(n){
  const s = state.settings;
  if (n <= 0) return 0;
  if (n <= 2) return Number(s.delivery_tier_1_2||59);
  if (n <= 4) return Number(s.delivery_tier_3_4||119);
  if (n <= 8) return Number(s.delivery_tier_5_8||199);
  return Number(s.delivery_tier_9plus||249);
}
function cartTotals(){
  const groups = cartByStore();
  const subtotal = groups.reduce((a,g)=>a+g.subtotal, 0);
  const isFree = subtotal >= Number(state.settings.free_delivery_threshold||999);
  const deliveryCharge = deliveryChargeForStoreCount(groups.length);
  const deliveryFee = isFree ? 0 : deliveryCharge;
  const marketplaceFee = Number(state.settings.marketplace_fee||5);
  let couponDiscount = 0;
  if (appliedCoupon && subtotal >= appliedCoupon.min_order){
    couponDiscount = appliedCoupon.discount_type === 'percent' ? Math.round(subtotal * appliedCoupon.discount_value / 100 * 100)/100 : appliedCoupon.discount_value;
    if (appliedCoupon.max_discount) couponDiscount = Math.min(couponDiscount, appliedCoupon.max_discount);
  }
  const total = subtotal + deliveryFee + marketplaceFee - couponDiscount;
  return { subtotal, deliveryFee, deliveryCharge, marketplaceFee, isFree, couponDiscount, total, groups };
}

async function applyCoupon(){
  const code = document.getElementById("coupon-input").value.trim().toUpperCase();
  if (!code){ appliedCoupon = null; render(); return; }
  const { data } = await sb.from("coupons").select("*, stores(name)").eq("code", code).eq("is_active", true).maybeSingle();
  if (!data){ toast("Invalid or expired coupon","err"); appliedCoupon = null; render(); return; }
  if (data.store_id){
    const cartStoreIds = new Set(state.cart.map(i=>i.products?.stores?.id));
    if (cartStoreIds.size !== 1 || !cartStoreIds.has(data.store_id)){
      toast(`This coupon only works on orders entirely from ${data.stores?.name||'that store'}`,"err");
      appliedCoupon = null; render(); return;
    }
  }
  const { subtotal } = cartTotals();
  if (subtotal < data.min_order){ toast(`This coupon needs a minimum order of ${money(data.min_order)}`,"err"); appliedCoupon = null; render(); return; }
  appliedCoupon = data;
  toast("Coupon applied!");
  render();
}

let newAddrGeo = null;
function selectAddrLabel(label){
  document.getElementById("addr-label").value = label;
  document.querySelectorAll(".addr-label-btn").forEach(b=>{
    const on = b.dataset.label === label;
    b.className = "addr-label-btn px-3 py-1.5 rounded-full text-xs font-semibold border " + (on ? "bg-brand-600 text-white border-brand-600" : "border-slate-200 text-slate-600");
  });

function wizUseLocationForAddress(){
  const status = document.getElementById("addr-geo-status");
  if (!navigator.geolocation){ status.textContent = "Geolocation not available on this device."; return; }
  status.textContent = "Detecting your location...";
  navigator.geolocation.getCurrentPosition(
    pos => { newAddrGeo = { lat: pos.coords.latitude, lng: pos.coords.longitude }; status.textContent = `Location captured ✓ — this helps your delivery partner navigate to you.`; status.className = "text-xs text-brand-600"; },
    () => { status.textContent = "Couldn't get your location — check browser permissions."; status.className = "text-xs text-red-500"; }
  );
}
async function saveNewAddress(){
  const label = document.getElementById("addr-label").value.trim() || "Home";
  const line = document.getElementById("addr-line").value.trim();
  if (!line) return toast("Enter an address","err");
  const { data: inserted, error } = await sb.from("addresses").insert({
    user_id: state.profile.id, label, address_line: line, is_default: state.addresses.length===0,
    lat: newAddrGeo?.lat ?? null, lng: newAddrGeo?.lng ?? null,
  }).select().single();
  if (error) return toast(error.message,"err");
  newAddrGeo = null;
  const { data } = await sb.from("addresses").select("*").eq("user_id", state.profile.id).order("is_default",{ascending:false});
  state.addresses = data || [];
  checkoutSelectedAddressId = inserted?.id || checkoutSelectedAddressId;
  render(); toast("Address saved");
}
async function placeOrder(){
  const { subtotal, deliveryFee, groups } = cartTotals();
  const addr = selectedCheckoutAddress();
  if (!addr) return toast("Please add a delivery address","err");
  const pm = checkoutPaymentMethod;
  const masterNumber = "TP" + Date.now().toString().slice(-9);
  const btn = document.querySelector('button[onclick="placeOrder()"]');
  if (btn){ btn.disabled = true; btn.textContent = "Placing order..."; }

  try {
    const { data: master, error: masterErr } = await sb.from("master_orders").insert({
      master_order_number: masterNumber, customer_id: state.profile.id,
      subtotal, delivery_fee: deliveryFee, // authoritative fees recomputed server-side — this is just a client hint
      delivery_lat: addr.lat, delivery_lng: addr.lng,
      coupon_code: appliedCoupon ? appliedCoupon.code : null,
      total: subtotal + deliveryFee,
      payment_method: pm, payment_status: pm === "online" ? "paid" : "pending",
      delivery_address_line: addr.address_line,
    }).select().single();
    if (masterErr) throw masterErr;

    const childPayload = groups.map((g,i)=>({
      order_number: masterNumber + "-S" + (i+1), master_order_id: master.id,
      customer_id: state.profile.id, store_id: g.store.id,
      subtotal: g.subtotal, total: g.subtotal, status: "placed",
      payment_method: pm, payment_status: pm === "online" ? "paid" : "pending",
      delivery_address_line: addr.address_line, delivery_lat: addr.lat, delivery_lng: addr.lng,
    }));
    const { data: children, error: childErr } = await sb.from("orders").insert(childPayload).select();
    if (childErr) throw childErr;

    const items = [];
    groups.forEach((g,i)=>{
      const childId = children[i].id;
      g.items.forEach(c=>items.push({ order_id: childId, product_id: c.product_id, product_name: c.products.name, unit_price: c.products.price, quantity: c.quantity, line_total: c.products.price*c.quantity }));
    });
    await sb.from("order_items").insert(items);
    await sb.from("cart_items").delete().eq("user_id", state.profile.id);
    appliedCoupon = null;
    await loadCart();
    toast("Order placed! 🎉");
    go("#/morder/" + master.id);
  } catch(e) {
    toast(e.message, "err");
    if (btn){ btn.disabled = false; btn.textContent = "Place Order"; }
  }
}

function statusLabel(s){
  return { placed:"Order Placed", confirmed:"Store Accepted", preparing:"Preparing", ready_for_pickup:"Ready for Pickup",
    dp_accepted:"Delivery Partner Assigned", arrived_at_store:"Partner Arrived at Store", picked_up:"Picked Up",
    on_the_way:"Out for Delivery", delivered:"Delivered", cancelled:"Cancelled", rejected:"Rejected" }[s] || s;
}
function statusColor(s){
  if (s==="delivered") return "text-brand-600 font-medium";
  if (s==="cancelled"||s==="rejected") return "text-red-500 font-medium";
  if (s==="placed") return "text-slate-400 font-medium";
  if (s==="confirmed"||s==="preparing") return "text-amber-600 font-medium";
  if (["ready_for_pickup","dp_accepted","arrived_at_store","picked_up","on_the_way"].includes(s)) return "text-blue-600 font-medium";
  return "text-amber-600 font-medium";
}
const TIMELINE_STEPS = [
  {key:"placed", label:"Placed"}, {key:"confirmed", label:"Accepted"}, {key:"ready_for_pickup", label:"Ready"},
  {key:"dp_accepted", label:"Assigned"}, {key:"picked_up", label:"Picked Up"}, {key:"on_the_way", label:"On the Way"},
  {key:"delivered", label:"Delivered"},
];
function orderTimeline(o){
  if (o.status === "cancelled") return `<div class="text-red-600 font-medium text-sm">Order Cancelled</div>`;
  if (o.status === "rejected") return `<div class="text-red-600 font-medium text-sm">Order Rejected${o.reject_reason?': '+escapeHtml(o.reject_reason):''}</div>`;
  const order = ["placed","confirmed","preparing","ready_for_pickup","dp_accepted","arrived_at_store","picked_up","on_the_way","delivered"];
  const collapse = {placed:0, confirmed:1, preparing:1, ready_for_pickup:2, dp_accepted:3, arrived_at_store:3, picked_up:4, on_the_way:5, delivered:6};
  const activeStep = collapse[o.status] ?? 0;
  return `<div class="flex items-center justify-between overflow-x-auto no-scrollbar gap-1">
    ${TIMELINE_STEPS.map((s,i)=>`<div class="flex-1 min-w-[60px] flex flex-col items-center relative">

  </div>`;
}

  const role = state.profile.role;
  let list = state.masterOrders;

  const tabsDp = [["available","Available"],["preparing","Preparing"],["mine","My Deliveries"],["delivered","Delivered"]];
  const tabs = role==="delivery_partner" ? tabsDp : tabsCustomer;
  if (role === "delivery_partner"){
    if (state.orderTab === "available") list = list.filter(m=>m.status==="placed" && !m.delivery_partner_id && masterAllReady(m));
    else if (state.orderTab === "preparing") list = list.filter(m=>m.status==="placed" && !m.delivery_partner_id && !masterAllReady(m) && masterActiveChildren(m).length>0);
    else if (state.orderTab === "mine") list = list.filter(m=>m.delivery_partner_id===state.profile.id && m.status!=="delivered");
    else if (state.orderTab === "delivered") list = list.filter(m=>m.delivery_partner_id===state.profile.id && m.status==="delivered");

async function approveMasterDeliveryTerms(masterId){
  const charge = Number(document.getElementById(`approve-delivery-charge-${masterId}`)?.value);
  const commission = Number(document.getElementById(`approve-dp-commission-${masterId}`)?.value);
  if (isNaN(charge) || charge < 0) return toast("Enter a valid delivery charge","err");
  if (isNaN(commission) || commission < 0 || commission > charge) return toast("Commission must be between 0 and the delivery charge","err");
  try { await rpc("rpc_admin_set_master_delivery_terms", { p_master_id: masterId, p_delivery_charge: charge, p_dp_commission: commission }); toast("Delivery terms approved"); await loadMasterOrders(); render(); }
  catch(e){ toast(e.message,"err"); }
}

  const waitMin = waitingMinutes(m.ready_at);
  const timeout = Number(state.settings.delivery_assignment_timeout_minutes||10);
  const overdue = waitMin != null && waitMin >= timeout;
  return `<div class="mt-5 rounded-xl p-4 ${overdue?'bg-red-50':'bg-slate-50'}">

      <div class="font-semibold text-sm">Waiting for a delivery partner</div>

    </div>
    ${overdue ? `<div class="text-xs text-red-600 mb-2">No rider has accepted this trip within the configured ${timeout}-minute window. Consider assigning one manually.</div>` : `<div class="text-xs text-slate-400 mb-2">Riders can still accept this automatically — manual assignment is only needed if none do within ${timeout} minutes.</div>`}

      <select id="assign-master-dp-select-${m.id}" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm">

  </div>`;
}

async function issueRefund(orderId, masterId){
  const idBase = masterId || orderId;
  const amount = Number(document.getElementById(`refund-amount-${idBase}`)?.value);
  const method = document.getElementById(`refund-method-${idBase}`)?.value || "wallet";
  const reason = document.getElementById(`refund-reason-${idBase}`)?.value?.trim();
  if (!amount || amount <= 0) return toast("Enter a valid refund amount","err");
  if (!reason || reason.length < 3) return toast("A reason is required","err");
  if (!confirm(`Refund ${money(amount)} via ${method}?`)) return;
  try {
    await rpc("rpc_admin_issue_refund", { p_order_id: orderId, p_master_id: masterId, p_amount: amount, p_reason: reason, p_method: method });
    toast("Refund issued"); await loadMasterOrders(); await loadOrders(); render();
  } catch(e){ toast(e.message,"err"); }
}

let qrScannerInstance = null;
function loadQrScannerLib(cb){
  if (window.Html5Qrcode) return cb();
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  s.onload = cb;
  s.onerror = ()=> toast('Could not load QR scanner — check your connection.','err');
  document.head.appendChild(s);
}
function openPickupQrScanner(){
  if (document.getElementById('qr-scanner-overlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'qr-scanner-overlay';
  overlay.className = 'fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4';
  overlay.innerHTML = `
    <div class="bg-white rounded-2xl p-4 w-full max-w-sm">
      <div class="flex items-center justify-between mb-3">
        <div class="font-bold text-sm">Scan Pickup QR</div>
        <button onclick="closePickupQrScanner()" class="text-slate-400">${icon('x','w-5 h-5')}</button>
      </div>
      <div id="qr-reader" style="width:100%"></div>
      <div class="text-xs text-slate-400 mt-2 text-center">Point your camera at the QR code on the store's shipping label</div>
    </div>`;
  document.body.appendChild(overlay);
  loadQrScannerLib(()=>{
    qrScannerInstance = new Html5Qrcode("qr-reader");
    qrScannerInstance.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decodedText)=>{ handlePickupQrResult(decodedText); },
      ()=>{}
    ).catch(()=>{ toast("Camera access failed — check camera permissions.","err"); closePickupQrScanner(); });
  });
}
function closePickupQrScanner(){
  const overlay = document.getElementById('qr-scanner-overlay');
  if (qrScannerInstance){
    qrScannerInstance.stop().then(()=>qrScannerInstance.clear()).catch(()=>{});
    qrScannerInstance = null;
  }
  overlay?.remove();
}
async function handlePickupQrResult(text){
  const parts = String(text||"").split("|");
  if (parts.length !== 3 || parts[0] !== "TPPICKUP"){
    toast("That doesn't look like a TownParcel pickup QR.","err");
    return;
  }
  const [, masterId, orderId] = parts;
  closePickupQrScanner();
  await dpMarkStorePickedUp(masterId, orderId);
}

async function reorderMaster(masterId){
  const m = state.masterOrders.find(x=>x.id===masterId);
  if (!m) return;
  if (state.cart.length) await sb.from("cart_items").delete().eq("user_id", state.profile.id);
  for (const c of (m.orders||[])){
    for (const item of c.order_items){

      await sb.from("cart_items").upsert({ user_id: state.profile.id, product_id: item.product_id, quantity: item.quantity }, { onConflict: "user_id,product_id" });
    }
  }
  await loadCart();

async function downloadMasterInvoice(masterId){
  const { data: m } = await sb.from("master_orders")
    .select("*, orders(*, stores(name, store_kyc(gst_number)), order_items(*, products(hsn_code))), customer:profiles!master_orders_customer_id_fkey(full_name, phone), delivery_partners(profiles(full_name))")

  if (!m) return;
  const w = window.open("", "_blank");
  const children = m.orders || [];
  const storeBlocks = children.map(c=>{
    const isCancelled = ["rejected","cancelled"].includes(c.status);
    const storeSubtotal = (c.order_items||[]).reduce((s,i)=>s+Number(i.line_total||0),0);
    return `
    <div style="position:relative">
      <h3 style="margin-top:16px;color:${isCancelled?'#999':'#158a46'}">🏬 ${escapeHtml(c.stores?.name||"")}</h3>
      ${isCancelled ? `<div style="display:inline-block;border:3px solid #dc2626;color:#dc2626;font-weight:800;font-size:12px;letter-spacing:1px;padding:3px 10px;border-radius:999px;transform:rotate(-6deg);margin:2px 0 6px">⊗ ORDER CANCELLED</div>` : ""}
      <p style="font-size:11px;color:#666;margin:2px 0">
        Seller GSTIN: ${escapeHtml(c.stores?.store_kyc?.gst_number || "Not registered")}
        ${c.invoice_number ? ` • Invoice No: ${escapeHtml(c.invoice_number)}` : ` • Invoice No: (generated once settled)`}
      </p>
      <table style="${isCancelled?'opacity:0.55':''}"><thead><tr><th>Item</th><th>HSN/SAC</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${c.order_items.map(i=>`<tr><td>${escapeHtml(i.product_name)}</td><td>${escapeHtml(i.products?.hsn_code||"—")}</td><td style="text-align:center">${i.quantity}</td><td style="text-align:right">${money(i.unit_price)}</td><td style="text-align:right">${money(i.line_total)}</td></tr>`).join("")}
      <tr style="font-weight:600;border-top:1px solid #ccc"><td colspan="4">${isCancelled?'Store Subtotal (not charged)':'Store Subtotal'}</td><td style="text-align:right">${isCancelled?'—':money(storeSubtotal)}</td></tr>
      </tbody></table>
    </div>`;
  }).join("");
  const activeChildren = children.filter(c=>!["rejected","cancelled"].includes(c.status));
  w.document.write(`<html><head><title>Invoice ${m.master_order_number}</title>
    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111} h1{color:#158a46} table{width:100%;border-collapse:collapse;margin-top:8px} td,th{padding:6px;border-bottom:1px solid #eee} th{text-align:left;color:#666;font-size:12px} .tot td{font-weight:bold;border-top:2px solid #111}</style>
    </head><body>
    <h1>TownParcel</h1>
    <p>Tax Invoice for Order #${m.master_order_number}<br/>
    Date: ${fmtDate(m.placed_at)}<br/>
    Customer: ${escapeHtml(m.customer?.full_name||"")}${m.customer?.phone?' • '+escapeHtml(m.customer.phone):''}<br/>
    ${children.length>1?`Ordered from ${children.length} stores in one checkout`:`Store: ${escapeHtml(children[0]?.stores?.name||"")}`}<br/>
    Deliver to: ${escapeHtml(m.delivery_address_line)}${m.delivery_partners?.profiles?.full_name?`<br/>Delivered by: ${escapeHtml(m.delivery_partners.profiles.full_name)}`:''}</p>
    ${storeBlocks}
    <table><tbody>
      <tr><td colspan="4">Items Subtotal (billed stores only)</td><td style="text-align:right">${money(activeChildren.reduce((s,c)=>s+(c.order_items||[]).reduce((s2,i)=>s2+Number(i.line_total||0),0),0))}</td></tr>
      <tr><td colspan="4">Delivery Fee</td><td style="text-align:right">${m.is_free_delivery?'FREE':money(m.delivery_fee)}</td></tr>
      <tr><td colspan="4">Marketplace Fee</td><td style="text-align:right">${money(m.marketplace_fee_amount)}</td></tr>
      ${m.cod_fee_amount>0?`<tr><td colspan="4">COD Handling Fee</td><td style="text-align:right">${money(m.cod_fee_amount)}</td></tr>`:""}
      ${m.tax_amount>0?`<tr><td colspan="4">GST</td><td style="text-align:right">${money(m.tax_amount)}</td></tr>`:""}
      ${m.coupon_discount>0?`<tr style="color:#158a46"><td colspan="4">Coupon Discount${m.coupon_code?' ('+escapeHtml(m.coupon_code)+')':''}</td><td style="text-align:right">-${money(m.coupon_discount)}</td></tr>`:""}
      <tr class="tot"><td colspan="4">Total Paid</td><td style="text-align:right">${money(m.total)}</td></tr>
    </tbody></table>
    <p style="margin-top:24px;font-size:12px;color:#888">Payment method: ${m.payment_method.toUpperCase()} • Payment status: ${m.payment_status}</p>
    <script>window.print()<\/script>

  w.document.close();

async function reorder(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  if (!o) return;
  if (state.cart.length) { await sb.from("cart_items").delete().eq("user_id", state.profile.id); }
  for (const item of o.order_items){
    if (!item.product_id) continue;
    await sb.from("cart_items").upsert({ user_id: state.profile.id, product_id: item.product_id, quantity: item.quantity }, { onConflict: "user_id,product_id" });
  }
  await loadCart();
  toast("Items added to cart");
  go("#/cart");
}

// ---------------------------------------------------------------------
// IMAGE UPLOADS
// ---------------------------------------------------------------------
// ─── IMAGE OPTIMIZATION ──────────────────────────────────────────────────────
// Converts to WebP, resizes to target dimensions, and progressively reduces
// quality until the target file size is reached. Falls back gracefully if the
// browser doesn't support WebP (returns JPEG in that case).
//
// Profiles per upload context:
//   product  → max 800×800, target 100–300 KB, quality 75–82
//   logo     → max 500×500, target  50–150 KB, quality 75–82
//   banner   → max 1600×600, target 200–500 KB, quality 75–82
//   avatar   → max 400×400, target  30–100 KB, quality 75–82
//   ad       → max 1200×600, target 150–400 KB, quality 75–82
//   default  → max 1200×1200, target 100–400 KB, quality 78
const IMAGE_PROFILES = {
  product: { maxW:800,  maxH:800,  targetMinKB:100, targetMaxKB:300, initQ:0.82 },
  logo:    { maxW:500,  maxH:500,  targetMinKB:50,  targetMaxKB:150, initQ:0.82 },
  banner:  { maxW:1600, maxH:600,  targetMinKB:200, targetMaxKB:500, initQ:0.82 },
  avatar:  { maxW:400,  maxH:400,  targetMinKB:30,  targetMaxKB:100, initQ:0.80 },
  ad:      { maxW:1200, maxH:600,  targetMinKB:150, targetMaxKB:400, initQ:0.80 },
  default: { maxW:1200, maxH:1200, targetMinKB:100, targetMaxKB:400, initQ:0.78 },
};
const WEBP_SUPPORTED = (()=>{ const c=document.createElement('canvas'); c.width=1; c.height=1; return c.toDataURL('image/webp').startsWith('data:image/webp'); })();
const OUTPUT_FORMAT = WEBP_SUPPORTED ? 'image/webp' : 'image/jpeg';
const OUTPUT_EXT    = WEBP_SUPPORTED ? 'webp' : 'jpg';

async function optimizeImage(file, profileName, onProgress){
  if (!file || !file.type.startsWith('image/')) return file;
  const profile = IMAGE_PROFILES[profileName] || IMAGE_PROFILES.default;
  onProgress?.('Reading image…');
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read image file.'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not decode image.'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        // Maintain aspect ratio, fit within maxW × maxH
        const scaleW = profile.maxW / w, scaleH = profile.maxH / h;
        const scale = Math.min(1, scaleW, scaleH);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // Progressive quality reduction to hit target size
        const targetMaxBytes = profile.targetMaxKB * 1024;
        let quality = profile.initQ;
        const tryCompress = ()=>{
          onProgress?.(`Optimising (quality ${Math.round(quality*100)}%)…`);
          canvas.toBlob(blob=>{
            if (!blob) return reject(new Error('Optimisation failed — browser could not encode image.'));
            if (blob.size > targetMaxBytes && quality > 0.40){
              quality = Math.max(0.40, quality - 0.06);
              tryCompress();
            } else {
              const fname = file.name.replace(/\.\w+$/, `.${OUTPUT_EXT}`);
              resolve(new File([blob], fname, { type: OUTPUT_FORMAT }));
            }
          }, OUTPUT_FORMAT, quality);
        };
        tryCompress();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let productImageUploadsInFlight = 0;
async function uploadImageFile(file, bucket, profileName){
  if (!file) return null;
  profileName = profileName || 'default';
  let toUpload = file;
  try {
    const el = document.getElementById('upload-progress-toast');
    const showProgress = (msg)=>{
      if (el){ el.textContent = msg; el.classList.remove('hidden'); }
    };
    toUpload = await optimizeImage(file, profileName, showProgress);
    if (el) el.classList.add('hidden');
    const origKB = Math.round(file.size/1024);
    const newKB  = Math.round(toUpload.size/1024);
    if (newKB < origKB) console.log(`Image optimised: ${origKB}KB → ${newKB}KB (${OUTPUT_EXT})`);
  } catch(err){
    console.warn('Image optimisation failed, using original:', err.message);
    // Fall through — still try to upload the original
  }
  if (toUpload.size > 10*1024*1024) throw new Error('This image is too large even after compression — please choose a smaller photo.');
  const path = `${state.profile.id}/${Date.now()}.${toUpload.name.split('.').pop()}`;
  const { error } = await sb.storage.from(bucket).upload(path, toUpload, { cacheControl:'3600', upsert:false });
  if (error) throw error;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

function handleProductImageChange(slot, input){
  const file = input.files[0]; if (!file) return;
  toast('Optimising image…');
  productImageUploadsInFlight++;
  const fieldName = slot === 1 ? 'image_url' : `image_url_${slot}`;
  uploadImageFile(file, 'product-images', 'product').then(url=>{
    const f = document.querySelector(`#product-form input[name="${fieldName}"]`); if (f) f.value = url;
    const pv = document.getElementById(`product-image-preview-${slot}`);
    const plus = document.getElementById(`product-image-plus-${slot}`);
    if (pv){ pv.src=url; pv.classList.remove('hidden'); }
    if (plus){ plus.classList.add('hidden'); }
    toast('Image uploaded ✓');
  }).catch(err=>toast(err.message,'err')).finally(()=>{ productImageUploadsInFlight = Math.max(0, productImageUploadsInFlight-1); });
}

function computeOrderSummaryRows(a){
  const customerName = {};
  a.allCustomers.forEach(c=>{ customerName[c.id] = c.full_name; });

  const masterRows = a.allMasterOrders.map(m=>{
    const stores = (m.orders||[]).map(c=>c.stores?.name).filter(Boolean);
    return {
      key: m.master_order_number,
      date: m.placed_at,
      deliveredAt: m.delivered_at,
      customer: customerName[m.customer_id] || "—",
      stores: stores.join(", ") || "—",
      orderValue: m.total,
      storeReceived: null,
      masterId: m.id,
      isMaster: true,
      dpReceived: m.delivery_partner_fee,
      platformRevenue: null,
      storeCommission: null,
      dpCommission: Number(m.delivery_partner_commission||0),
      marketplaceFee: Number(m.marketplace_fee_amount||0),
      codFee: Number(m.cod_fee_amount||0),
      settlementStatus: m.settlement_status,
      dpPaid: !!m.delivery_paid_at,
      payment: `${m.payment_method.toUpperCase()} / ${m.payment_status}`,
      status: masterStatusLabel(m.status),
      isCancelled: m.status === "cancelled",
      isDelivered: m.status === "delivered",
    };
  });
  const childrenByMaster = {};
  a.allOrders.filter(o=>o.master_order_id).forEach(o=>{
    (childrenByMaster[o.master_order_id] = childrenByMaster[o.master_order_id]||[]).push(o);
  });
  masterRows.forEach(r=>{
    const kids = childrenByMaster[r.masterId] || [];
    r.storeReceived = kids.reduce((s,c)=>s+Number(c.store_payout||0),0);
    r.storeCommission = kids.reduce((s,c)=>s+Number(c.commission_amount||0),0);
    r.platformRevenue = r.storeCommission + r.dpCommission + r.marketplaceFee + r.codFee;
    r.storePaid = kids.length > 0 && kids.every(c=>!!c.store_paid_at);
  });

  const standaloneRows = a.allOrders.filter(o=>!o.master_order_id).map(o=>({
    key: o.order_number,
    date: o.placed_at,
    deliveredAt: o.delivered_at,
    customer: customerName[o.customer_id] || "—",
    stores: o.stores?.name || "—",
    orderValue: o.total,
    storeReceived: Number(o.store_payout||0),
    dpReceived: Number(o.delivery_partner_fee||0),
    storeCommission: Number(o.commission_amount||0),
    dpCommission: Number(o.delivery_partner_commission||0),
    marketplaceFee: Number(o.marketplace_fee_amount||0),
    codFee: Number(o.cod_fee_amount||0),
    settlementStatus: o.settlement_status,
    storePaid: !!o.store_paid_at,
    dpPaid: !!o.delivery_paid_at,
    platformRevenue: Number(o.commission_amount||0) + Number(o.delivery_partner_commission||0) + Number(o.marketplace_fee_amount||0) + Number(o.cod_fee_amount||0),
    payment: `${o.payment_method.toUpperCase()} / ${o.payment_status}`,
    status: statusLabel(o.status),
    isMaster: false, masterId: null,
    isCancelled: ["cancelled","rejected"].includes(o.status),
    isDelivered: o.status === "delivered",
  }));

  return [...masterRows, ...standaloneRows].sort((a,b)=>new Date(b.date)-new Date(a.date));
}
let adminTimeReportMode = "daily";
function viewAdminTimeReports(){

    const d = new Date(r.date);
    const key = mode === "daily"
      ? d.toLocaleDateString('en-CA') // YYYY-MM-DD, sorts correctly as text
      : d.toLocaleDateString('en-US', { year:'numeric', month:'long' });
    if (!buckets[key]) buckets[key] = { orders:0, delivered:0, cancelled:0, sales:0, storeReceived:0, dpReceived:0, platformRevenue:0 };
    const b = buckets[key];
    b.orders += 1;
    if (r.isCancelled) b.cancelled += 1;
    if (r.isDelivered){
      b.delivered += 1;
      b.sales += Number(r.orderValue);
      b.storeReceived += Number(r.storeReceived||0);
      b.dpReceived += Number(r.dpReceived||0);
      b.platformRevenue += Number(r.platformRevenue||0);
    }
  });

        </tr></thead>
        <tbody>${sortedKeys.map(k=>{ const b=buckets[k]; return `<tr class="border-t border-slate-50">
          <td class="p-3 font-medium">${k}</td>
          <td class="p-3 text-right">${b.orders}</td>

let storeReportMode = "daily";
function viewStoreReports(){
  const mode = storeReportMode;
  const delivered = state.orders.filter(o=>o.status==="delivered");
  const buckets = {};
  state.orders.forEach(o=>{
    const d = new Date(o.placed_at);
    const key = mode === "daily" ? d.toLocaleDateString('en-CA') : d.toLocaleDateString('en-US',{year:'numeric',month:'long'});
    if (!buckets[key]) buckets[key] = { orders:0, delivered:0, cancelled:0, sales:0, earnings:0, itemsSold:0 };
    const b = buckets[key];
    b.orders += 1;
    if (["cancelled","rejected"].includes(o.status)) b.cancelled += 1;
    if (o.status === "delivered"){
      b.delivered += 1;
      b.sales += Number(o.subtotal||0);
      b.earnings += Number(o.store_payout||0);
      b.itemsSold += (o.order_items||[]).reduce((s,i)=>s+i.quantity,0);
    }
  });
  const sortedKeys = Object.keys(buckets).sort((a,b)=> mode==="daily" ? (a<b?1:-1) : (new Date(b+" 1")-new Date(a+" 1")));
  const totalSales = delivered.reduce((s,o)=>s+Number(o.subtotal||0),0);
  const totalEarnings = delivered.reduce((s,o)=>s+Number(o.store_payout||0),0);
  const commissionPct = Number(state.store.commission_percent||10);

  // Itemized rows: one row per product line, for a proper "hardcopy" ledger.
  // Delivery charge is a per-ORDER deduction (not per product line), so it must only
  // appear once — on the first line of each order — or a multi-item order double/triple counts it.
  const itemRows = [];
  const deliveryChargedOrders = new Set();
  delivered.slice().sort((a,b)=>new Date(b.delivered_at||b.placed_at)-new Date(a.delivered_at||a.placed_at)).forEach(o=>{
    (o.order_items||[]).forEach(i=>{
      const isFirstLineOfOrder = !deliveryChargedOrders.has(o.id);
      deliveryChargedOrders.add(o.id);
      itemRows.push({
        date: o.delivered_at || o.placed_at,
        orderNum: o.order_number,
        product: i.product_name,
        qty: i.quantity,
        price: Number(i.line_total),
        afterCommission: Math.round(Number(i.line_total) * (1 - commissionPct/100) * 100)/100,
        deliveryCharge: isFirstLineOfOrder ? Number(o.store_delivery_share||0) : 0,
        get netReceived(){ return Math.round((this.afterCommission - this.deliveryCharge) * 100)/100; },
      });
    });
  });

  return `<div class="pt-6"><div id="print-stamp"></div>
    <a href="#/store-dashboard" class="text-sm text-slate-500 flex items-center gap-1 mb-3 no-print">${icon('back','w-4 h-4')} Back to dashboard</a>
    <h1 class="text-xl font-bold mb-1">Sales Reports</h1>
    <p class="text-xs text-slate-400 mb-4">What you sold, day by day, month by month, or product by product.</p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      ${statCard("Total Sales (Delivered)", money(totalSales), "wallet", "#/store-reports")}
      ${statCard("Total Earnings (Delivered)", money(totalEarnings), "wallet", "#/store-reports", "text-brand-600")}
    </div>
    <div class="flex gap-2 mb-4 no-print flex-wrap">
      <button onclick="storeReportMode='daily';render()" class="px-4 py-2 rounded-xl text-sm font-semibold ${mode==='daily'?'bg-brand-600 text-white':'bg-slate-100 text-slate-600'}">Daily</button>
      <button onclick="storeReportMode='monthly';render()" class="px-4 py-2 rounded-xl text-sm font-semibold ${mode==='monthly'?'bg-brand-600 text-white':'bg-slate-100 text-slate-600'}">Monthly</button>
      <button onclick="storeReportMode='itemized';render()" class="px-4 py-2 rounded-xl text-sm font-semibold ${mode==='itemized'?'bg-brand-600 text-white':'bg-slate-100 text-slate-600'}">Itemized</button>
      <button onclick="exportStoreReportCsv()" class="ml-auto px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold">Export CSV</button>
      <button onclick="printPage('${mode==='itemized'?'Itemized Sales Report':mode==='daily'?'Daily':'Monthly'} ${mode==='itemized'?'':'Sales Report'}')" class="px-3 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold">🖨 Print</button>
    </div>
    ${mode === 'itemized' ? `
    <div class="overflow-x-auto bg-white rounded-2xl shadow-card">
      <table class="w-full text-xs" id="store-report-table">
        <thead class="bg-slate-50 text-slate-500"><tr>
          <th class="p-3 text-left">Date</th><th class="p-3 text-left">Order ID</th><th class="p-3 text-left">Product</th>
          <th class="p-3 text-right">Qty</th><th class="p-3 text-right">Price</th>
          <th class="p-3 text-right">After Commission (${commissionPct}%)</th><th class="p-3 text-right">Delivery Charge (if paid by store)</th>
          <th class="p-3 text-right">Total Received</th>
        </tr></thead>
        <tbody>${itemRows.map(r=>`<tr class="border-t border-slate-50">
          <td class="p-3 whitespace-nowrap">${fmtDate(r.date)}</td>
          <td class="p-3">#${escapeHtml(r.orderNum)}</td>
          <td class="p-3">${escapeHtml(r.product)}</td>
          <td class="p-3 text-right">${r.qty}</td>
          <td class="p-3 text-right">${money(r.price)}</td>
          <td class="p-3 text-right">${money(r.afterCommission)}</td>
          <td class="p-3 text-right ${r.deliveryCharge>0?'text-red-600':''}">${r.deliveryCharge>0?'-'+money(r.deliveryCharge):'—'}</td>
          <td class="p-3 text-right text-brand-600 font-semibold">${money(r.netReceived)}</td>
        </tr>`).join("") || `<tr><td class="p-4 text-slate-400" colspan="8">No delivered orders yet</td></tr>`}</tbody>
        ${itemRows.length ? `<tfoot><tr class="border-t-2 border-slate-200 font-bold bg-slate-50">
          <td class="p-3" colspan="4">Total</td>
          <td class="p-3 text-right">${money(itemRows.reduce((s,r)=>s+r.price,0))}</td>
          <td class="p-3 text-right">${money(itemRows.reduce((s,r)=>s+r.afterCommission,0))}</td>
          <td class="p-3 text-right text-red-600">-${money(itemRows.reduce((s,r)=>s+r.deliveryCharge,0))}</td>
          <td class="p-3 text-right text-brand-600">${money(itemRows.reduce((s,r)=>s+r.netReceived,0))}</td>
        </tr></tfoot>` : ""}
      </table>
    </div>` : `
    <div class="overflow-x-auto bg-white rounded-2xl shadow-card">
      <table class="w-full text-xs" id="store-report-table">
        <thead class="bg-slate-50 text-slate-500"><tr>
          <th class="p-3 text-left">${mode==='daily'?'Date':'Month'}</th><th class="p-3 text-right">Orders</th><th class="p-3 text-right">Delivered</th>
          <th class="p-3 text-right">Cancelled</th><th class="p-3 text-right">Items Sold</th><th class="p-3 text-right">Sales</th><th class="p-3 text-right">Your Earnings</th>
        </tr></thead>
        <tbody>${sortedKeys.map(k=>{ const b=buckets[k]; return `<tr class="border-t border-slate-50">
          <td class="p-3 font-medium">${k}</td>
          <td class="p-3 text-right">${b.orders}</td>
          <td class="p-3 text-right">${b.delivered}</td>
          <td class="p-3 text-right">${b.cancelled}</td>
          <td class="p-3 text-right">${b.itemsSold}</td>
          <td class="p-3 text-right font-semibold">${money(b.sales)}</td>
          <td class="p-3 text-right text-brand-600 font-semibold">${money(b.earnings)}</td>
        </tr>`; }).join("") || `<tr><td class="p-4 text-slate-400" colspan="7">No orders yet</td></tr>`}</tbody>
      </table>
    </div>`}
  </div>`;
}
function exportStoreReportCsv(){
  const mode = storeReportMode;
  const headers = mode === 'itemized'
    ? ["Date","Order ID","Product","Qty","Price",`After Commission (${Number(state.store?.commission_percent||10)}%)`,"Delivery Charge (if paid by store)","Total Received"]
    : [mode==='daily'?'Date':'Month',"Orders","Delivered","Cancelled","Items Sold","Sales","Your Earnings"];
  const rows = [headers];
  document.querySelectorAll("#store-report-table tbody tr").forEach(tr=>{
    rows.push(Array.from(tr.children).map(td=>td.textContent.trim()));
  });
  csvDownload(`townparcel_${mode}_report.csv`, rows);
}

  const totalSold = Object.values(soldByProduct).reduce((s,v)=>s+v,0);

  return `<div class="pt-6">

          <div class="bg-slate-50 rounded-xl py-2"><div class="font-bold text-sm">${sold} <span class="font-normal text-[10px] text-slate-400">${unit}</span></div><div class="text-[10px] text-slate-400 mt-0.5">Sold</div></div>
          <div class="bg-slate-50 rounded-xl py-2"><div class="font-bold text-sm ${available===0?'text-red-500':available<5?'text-amber-600':''}">${available} <span class="font-normal text-[10px] text-slate-400">${unit}</span></div><div class="text-[10px] text-slate-400 mt-0.5">Available</div></div>

async function saveAddStock(form){
  const productId = form.get("product_id");
  const qty = Number(form.get("qty"));
  if (!qty || qty <= 0){ toast("Enter a valid quantity to add.","err"); return; }
  const { error } = await sb.rpc("rpc_store_add_stock", { p_product_id: productId, p_qty: qty });
  if (error){ toast(error.message,"err"); return; }
  toast("Stock added");
  await loadStoreProducts();
  go("#/store-inventory");
}
document.addEventListener("submit", async (e)=>{
  if (e.target.id === "add-stock-form"){
    e.preventDefault();
    try { await saveAddStock(new FormData(e.target)); }
    catch(err){ console.error(err); toast("Something went wrong adding stock — please try again.","err"); }
  }
});

        </tr>`).join("") || `<tr><td class="p-4 text-slate-400 text-center" colspan="5">No stock additions logged yet</td></tr>`}</tbody>
      </table>

async function loadStoreProducts(){
  if (!state.store && state.profile?.role === "store_owner"){
    const { data: s } = await sb.from("stores").select("*").eq("owner_id", state.profile.id).maybeSingle();
    state.store = s || null;
  }
  if (!state.store) return;
  const { data } = await sb.from("products").select("*").eq("store_id", state.store.id).order("created_at",{ascending:false});
  state.products = data || [];
}

    status: p?.status || 'draft', weight_grams: p?.weight_grams || '', prep_time_minutes: p?.prep_time_minutes || '',

function renderAddProductInPlace(){
  const content = renderAddProductPage();
  renderShell(shell(content));
}
function refreshPreview(){
  const s = addProductState; if (!s) return;
  const nameEl = document.getElementById('preview-name');
  if (nameEl) nameEl.textContent = s.name || 'Product Name';
}
function calcDiscount(){
  const s = addProductState; if (!s) return;
  const disc = (s.mrp && s.price && Number(s.mrp)>Number(s.price)) ? (100*(1-Number(s.price)/Number(s.mrp))).toFixed(1) : 0;
  const el = document.getElementById('ap-discount-display');
  if (el){ el.textContent = disc ? disc+'%' : '—'; el.className = `border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-slate-50 font-semibold ${disc?'text-brand-600':'text-slate-400'}`; }
}
function onAddProductCategoryChange(catId){
  const s = addProductState; if (!s) return;
  const oldCatName = state.categories.find(c=>c.id===s.category_id)?.name;
  const newCatName = state.categories.find(c=>c.id===catId)?.name;
  const hasAttr = Object.values(s.attributes).some(v=>v);
  if (oldCatName && newCatName && oldCatName!==newCatName && hasAttr){
    if (!confirm('Changing category will clear the previous category details. Continue?')) return;
  }
  s.category_id = catId;
  s.category_name = newCatName || '';
  s.attributes = {};
  if (newCatName && CATEGORY_UNITS[newCatName]) s.unit = CATEGORY_UNITS[newCatName];
  renderAddProductInPlace();
}
function prevAddProductStep(){ if (addProductState && addProductState.step>1){ addProductState.step--; renderAddProductInPlace(); window.scrollTo(0,0); } }
function nextAddProductStep(){
  const s = addProductState; if (!s) return;
  // Validate current step
  let valid = true;
  if (s.step===1){
    if (!s.name || s.name.trim().length<2){ showErr('err-name',true); valid=false; } else showErr('err-name',false);
  }
  if (s.step===2){
    if (!s.category_id){ showErr('err-category',true); valid=false; } else showErr('err-category',false);
  }
  if (s.step===3){
    if (!s.mrp||Number(s.mrp)<=0){ showErr('err-mrp',true); valid=false; } else showErr('err-mrp',false);
    if (!s.price||Number(s.price)<=0){ showErr('err-price',true); valid=false; } else showErr('err-price',false);
    if (valid && Number(s.price)>Number(s.mrp)){ toast('Selling price cannot exceed MRP','err'); valid=false; }
  }
  if (s.step===4){
    if (s.stock_qty===''||s.stock_qty===undefined){ showErr('err-stock',true); valid=false; } else showErr('err-stock',false);
  }
  if (!valid) return;
  if (s.step<6){ s.step++; renderAddProductInPlace(); window.scrollTo(0,0); }
}
function showErr(id, show){ const el=document.getElementById(id); if(el) el.classList.toggle('hidden',!show); }

let _addProductImgUploading = false;
function onAddProductImageChange(idx, input){
  const file = input.files[0]; if (!file) return;
  const s = addProductState; if (!s) return;
  const preview = URL.createObjectURL(file);
  s._imgPreviews[idx] = preview;
  s._imgFiles[idx] = file;
  renderAddProductInPlace();
}
function removeAddProductImage(idx){
  const s = addProductState; if (!s) return;
  s._imgPreviews[idx] = '';
  s._imgFiles[idx] = null;
  s[idx===0?'image_url':idx===1?'image_url_2':'image_url_3'] = '';
  renderAddProductInPlace();
}

async function _uploadAddProductImages(){
  const s = addProductState;
  const origUrls = [s.image_url, s.image_url_2, s.image_url_3];
  const fields = ['image_url','image_url_2','image_url_3'];
  for (let i=0; i<3; i++){
    if (s._imgFiles[i]){
      const url = await uploadImageFile(s._imgFiles[i], 'product-images', 'product');
      s[fields[i]] = url;
      s._imgPreviews[i] = url;
      s._imgFiles[i] = null;
    }
  }
}

async function saveAddProductDraft(){
  const s = addProductState; if (!s) return;
  if (!s.name||s.name.trim().length<2){ toast('Please enter a product name first','err'); return; }
  toast('Saving draft…');
  try {
    await _uploadAddProductImages();
    const payload = buildAddProductPayload('draft');
    if (s.id){
      const {error} = await sb.from('products').update(payload).eq('id',s.id);
      if (error) throw error;
    } else {
      const {data, error} = await sb.from('products').insert({store_id:state.store.id,...payload}).select('id').single();
      if (error) throw error;
      s.id = data.id;
    }
    await loadStoreProducts();
    toast('Draft saved ✓');
    renderAddProductInPlace();
  } catch(e){ toast(e.message,'err'); }
}

async function publishAddProduct(){
  const s = addProductState; if (!s) return;
  // Full validation
  if (!s.name||s.name.trim().length<2){ toast('Product name is required','err'); return; }
  if (!s.category_id){ toast('Please select a category','err'); return; }
  if (!s.price||Number(s.price)<=0){ toast('Please enter a valid selling price','err'); return; }
  if (!s.mrp||Number(s.mrp)<=0){ toast('Please enter the MRP','err'); return; }
  if (!s._imgPreviews[0]&&!s.image_url){ toast('Please upload at least one product image','err'); return; }
  const btn = document.querySelector('button[onclick="publishAddProduct()"]');
  if (btn){ btn.disabled=true; btn.textContent='Publishing…'; }
  try {
    toast('Optimising images…');
    await _uploadAddProductImages();
    toast('Saving product…');
    const payload = buildAddProductPayload('published');
    if (s.id){
      const {error} = await sb.from('products').update(payload).eq('id',s.id);
      if (error) throw error;
    } else {
      const {data,error} = await sb.from('products').insert({store_id:state.store.id,...payload}).select('id').single();
      if (error) throw error;
      s.id = data.id;
    }
    await loadStoreProducts();
    renderShell(shell(`<div class="pt-16 max-w-md mx-auto text-center">
      <div class="text-6xl mb-4">🎉</div>
      <div class="text-2xl font-bold text-brand-600 mb-2">Product Published!</div>
      <div class="text-slate-500 mb-6">Your product is now available to Town Parcel customers.</div>
      <div class="flex flex-col gap-3">
        <button onclick="go('#/store-products')" class="w-full py-3 bg-brand-600 text-white rounded-xl font-semibold">View All Products</button>
        <button onclick="startAddProduct(null)" class="w-full py-3 border border-slate-200 rounded-xl font-semibold">Add Another Product</button>
        <a href="#/store-dashboard" class="w-full py-3 border border-slate-200 rounded-xl font-semibold block">Back to Dashboard</a>
      </div>
    </div>`));
  } catch(e){
    toast(e.message,'err');
    if (btn){ btn.disabled=false; btn.textContent='🚀 Publish Product'; }
  }
}

function buildAddProductPayload(status){
  const s = addProductState;
  const disc = (s.mrp && s.price && Number(s.mrp)>Number(s.price)) ? Number(((1-Number(s.price)/Number(s.mrp))*100).toFixed(2)) : 0;
  return {
    name: s.name.trim(), brand: s.brand||null, short_description: s.short_description||null,
    description: s.description||null, category_id: s.category_id||null,
    category_attributes: Object.keys(s.attributes||{}).length ? s.attributes : null,
    price: Number(s.price)||0, mrp: Number(s.mrp)||null, compare_price: Number(s.compare_price)||null,
    cost_price: Number(s.cost_price)||null,
    sku: s.sku||null, barcode: s.barcode||null,
    stock_qty: Number(s.stock_qty)||0, low_stock_threshold: Number(s.low_stock_threshold)||5,
    unit: s.unit||'piece(s)', stock_unit: s.unit||'piece(s)',
    sub_unit_qty: Number(s.sub_unit_qty)||null, sub_unit_type: s.sub_unit_type||null,
    hsn_code: s.hsn_code||null, gst_applicable: !!s.gst_applicable,
    gst_rate: Number(s.gst_rate)||0, tax_inclusive: !!s.tax_inclusive,
    weight_grams: Number(s.weight_grams)||null, prep_time_minutes: Number(s.prep_time_minutes)||null,
    image_url: s.image_url||null, image_url_2: s.image_url_2||null, image_url_3: s.image_url_3||null,
    status, is_available: status==='published',
  };
}

async function startAddProduct(existingId){
  await loadStoreProducts();
  const existing = existingId ? state.products.find(p=>p.id===existingId) : null;
  if (existingId && !existing){ toast('Product not found','err'); return; }
  initAddProductState(existing);
  renderShell(shell(renderAddProductPage()));
}

function toggleProductForm(forceOpen){

  else form.classList.toggle("hidden");

function syncStockUnitLabel(unitType){
  const label = document.getElementById("stock-qty-label");
  if (label) label.textContent = `Stock quantity (${unitType})`;
}
function updateStockTotalPreview(){
  const stockQty = Number(document.getElementById("product-form")?.querySelector('[name="stock_qty"]')?.value || 0);
  const subQty = Number(document.getElementById("product-form")?.querySelector('[name="sub_unit_qty"]')?.value || 0);
  const subType = document.getElementById("product-form")?.querySelector('[name="sub_unit_type"]')?.value || "";
  const primaryUnit = document.getElementById("product-unit-type")?.value || "";
  const el = document.getElementById("stock-total-preview");
  if (!el) return;
  if (stockQty > 0 && subQty > 0 && subType){
    const total = (stockQty * subQty).toLocaleString('en-IN',{maximumFractionDigits:3});
    el.textContent = `→ ${stockQty} ${primaryUnit} × ${subQty} ${subType} = ${total} ${subType} total`;
  } else if (stockQty > 0 && primaryUnit){
    el.textContent = `→ ${stockQty} ${primaryUnit} in stock`;
  } else {
    el.textContent = "";
  }
}
function updateDiscountPreview(){
  const price = Number(document.getElementById("product-price")?.value || 0);
  const mrp = Number(document.getElementById("product-mrp")?.value || 0);
  const el = document.getElementById("product-discount-preview");
  if (!el) return;
  if (mrp > price && price > 0){
    const off = Math.round((1 - price/mrp) * 100);
    el.textContent = `${off}% OFF (customer saves ${money(mrp-price)})`;
  } else {
    el.textContent = "";
  }
}

document.addEventListener("submit", async (e)=>{
  if (e.target.id === "product-form"){
    e.preventDefault();
    if (productImageUploadsInFlight > 0){
      toast("Still uploading your photo — please wait a moment and try Save again.","err");
      return;
    }
    const submitBtn = e.target.querySelector("button[type='submit'], button:not([type])");
    const originalBtnText = submitBtn ? submitBtn.textContent : "";
    try {
      if (submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Saving..."; }
      const fd = new FormData(e.target);
      const name = (fd.get("name")||"").trim();
      const price = fd.get("price");
      const mrp = fd.get("mrp");
      if (!name){ toast("Please enter a product name.","err"); return; }
      if (!price || Number(price) <= 0){ toast("Please enter a valid selling price.","err"); return; }
      if (!mrp || Number(mrp) <= 0){ toast("Please enter the MRP.","err"); return; }
      if (Number(price) > Number(mrp)){ toast("Selling price cannot be higher than MRP.","err"); return; }
      const unitQty = fd.get("unit_qty") || "1";
      const unitType = fd.get("unit_type") || "piece(s)";
      const subUnitQty = fd.get("sub_unit_qty");
      const subUnitType = fd.get("sub_unit_type");
      const payload = {
        name,
        unit: `${unitQty} ${unitType}`,
        stock_unit: unitType,
        sub_unit_qty: subUnitQty && Number(subUnitQty) > 0 ? Number(subUnitQty) : null,
        sub_unit_type: subUnitType || null,
        category_id: fd.get("category_id") || null,
        price: Number(price),
        mrp: Number(mrp),
        compare_price: fd.get("compare_price") ? Number(fd.get("compare_price")) : null,
        sku: fd.get("sku")?.trim() || null,
        barcode: fd.get("barcode")?.trim() || null,
        stock_qty: Number(fd.get("stock_qty")) || 0,
        description: fd.get("description")?.trim() || null,
        hsn_code: fd.get("hsn_code")?.trim() || null,
        image_url: fd.get("image_url") || null,
        image_url_2: fd.get("image_url_2") || null,
        image_url_3: fd.get("image_url_3") || null,
      };
      let error, productId;
      if (editingProduct){
        productId = editingProduct.id;
        ({ error } = await sb.from("products").update(payload).eq("id", productId));
      } else {
        if (!state.store || !state.store.id){ toast("Couldn't find your store — please reload the page and try again.","err"); return; }
        const { data: inserted, error: insertErr } = await sb.from("products").insert({ store_id: state.store.id, ...payload }).select("id").single();
        error = insertErr;
        productId = inserted?.id;
      }
      if (error){ toast(error.message,"err"); return; }

      // Sync variants: delete-and-reinsert pattern
      if (productId){
        await sb.from("product_variants").delete().eq("product_id", productId);
        const validVariants = editingProductVariants
          .filter(v=>v.size || v.color) // at least one of size/color must be filled
          .map(v=>({
            product_id: productId,
            color: v.color || null,
            size: v.size || null,
            sub_unit: null,
            sku: null,
            barcode: null,
            price: v.price && Number(v.price) > 0 ? Number(v.price) : Number(payload.price),
            compare_price: null,
            stock_qty: Number(v.stock_qty) || 0,
          }));
        if (validVariants.length){
          const { error: varErr } = await sb.from("product_variants").insert(validVariants);
          if (varErr) toast("Product saved, but variants had an issue: "+varErr.message,"err");
        }
      }

      toast(editingProduct?"Product updated":"Product added");
      editingProduct = null;
      editingProductVariants = [];
      await loadStoreProducts(); render();
    } catch(err){
      console.error("Product save failed:", err);
      toast("Something went wrong saving the product — please try again. If this keeps happening, tell support what you were doing.","err");
    } finally {
      if (submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
    }
  }
});
async function toggleProductAvailability(id, val){ await sb.from("products").update({ is_available: val }).eq("id", id); await loadStoreProducts(); render(); }
async function quickMarkOutOfStock(productId, productName){
  if (!confirm(`Mark "${productName}" as out of stock? It'll still show to customers, but they won't be able to order it until you restock it.`)) return;
  await sb.from("products").update({ stock_qty: 0 }).eq("id", productId);
  toast(`${productName} marked out of stock`);
  render();
}

function adminNavLeaf(item, active, pendingCount){

  const onclickAttr = scrollId ? ` onclick="go('${r}'); setTimeout(()=>document.getElementById('${scrollId}')?.scrollIntoView({behavior:'smooth'}),250); return false;"` : "";
  return `<a href="${r}" class="${cls}"${onclickAttr}>
