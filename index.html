function orderPipelineBlock(a){
  const standalone = a.allOrders.filter(o=>!o.master_order_id);
  const timeout = Number(state.settings.delivery_assignment_timeout_minutes||10);

  const pendingAcceptance = a.allOrders.filter(o=>o.status==="placed").length;
  const preparing = a.allOrders.filter(o=>["confirmed","preparing"].includes(o.status)).length;
  const readyForPickup = a.allOrders.filter(o=>o.status==="ready_for_pickup").length;

  const waitingStandalone = standalone.filter(o=>o.status==="ready_for_pickup" && !o.delivery_partner_id);
  const waitingMasters = a.allMasterOrders.filter(m=>m.status==="placed" && !m.delivery_partner_id && masterAllReady(m));
  const waiting = waitingStandalone.length + waitingMasters.length;
  const overdueCount = waitingStandalone.filter(o=>{const w=waitingMinutes(o.ready_at); return w!=null && w>=timeout;}).length
    + waitingMasters.filter(m=>{const w=waitingMinutes(m.ready_at); return w!=null && w>=timeout;}).length;

  const assigned = standalone.filter(o=>["dp_accepted","arrived_at_store"].includes(o.status)).length
    + a.allMasterOrders.filter(m=>m.status==="dp_assigned").length;
  const pickedUp = standalone.filter(o=>o.status==="picked_up").length
    + a.allMasterOrders.filter(m=>["picking_up","all_picked_up"].includes(m.status)).length;
  const outForDelivery = standalone.filter(o=>o.status==="on_the_way").length
    + a.allMasterOrders.filter(m=>m.status==="out_for_delivery").length;
  const delivered = standalone.filter(o=>o.status==="delivered").length
    + a.allMasterOrders.filter(m=>m.status==="delivered").length;
  const cancelled = standalone.filter(o=>["cancelled","rejected"].includes(o.status)).length
    + a.allMasterOrders.filter(m=>m.status==="cancelled").length;

  const stages = [
    ["Pending Store Acceptance", pendingAcceptance, "#/admin-orders"],
    ["Preparing", preparing, "#/admin-orders"],
    ["Ready for Pickup", readyForPickup, "#/admin-orders"],
    ["Waiting for Delivery Partner", waiting, "#/admin-master-orders"],
    ["Assigned Delivery Partner", assigned, "#/admin-master-orders"],
    ["Picked Up", pickedUp, "#/admin-master-orders"],
    ["Out for Delivery", outForDelivery, "#/admin-master-orders"],
    ["Delivered", delivered, "#/admin-orders"],
    ["Cancelled", cancelled, "#/admin-orders"],
  ];
  return `
  <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
    ${stages.map(([label, count, href])=>`<a href="${href}" class="bg-white rounded-2xl shadow-card p-3 text-center hover:shadow-pop transition">
      <div class="text-xl font-bold">${count}</div>
      <div class="text-[10px] text-slate-400 leading-tight mt-0.5">${label}</div>
    </a>`).join("")}
  </div>
  ${overdueCount>0 ? `<div class="mt-2 text-xs text-red-600 font-semibold">${overdueCount} trip${overdueCount!==1?'s':''} waiting over ${timeout} minutes for a rider — <a href="#/admin-master-orders" class="underline">review and assign manually</a></div>` : ""}
  `;
}
function filterAdminGlobalSearch(){
  const q = (document.getElementById("admin-global-search")?.value || "").trim().toLowerCase();
  const box = document.getElementById("admin-global-search-results");
  if (!box) return;
  if (!q){ box.classList.add("hidden"); box.innerHTML = ""; return; }

  const a = state.admin;
  const sections = [];

  // ── TP-ST / TP-DP code lookup (instant, exact-prefix match) ──────────
  const storeCodeMatch = a.allStores.filter(s=>(s.store_code||"").toLowerCase().includes(q));
  const dpCodeMatch = a.allDp.filter(d=>(d.delivery_partner_code||"").toLowerCase().includes(q));
  if (storeCodeMatch.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-brand-600 uppercase">🏪 Store ID Match</div>` +
    storeCodeMatch.map(s=>`<a href="#/admin-store/${s.id}" class="flex items-center justify-between px-3 py-2 hover:bg-brand-50 text-sm">
      <div><span class="font-bold text-brand-700">${escapeHtml(s.store_code||"")}</span> <span class="text-slate-600">— ${escapeHtml(s.name)}</span></div>
      <span class="text-xs text-slate-400 capitalize">${s.status}</span>
    </a>`).join(""));
  if (dpCodeMatch.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-brand-600 uppercase">🛵 Delivery Partner ID Match</div>` +
    dpCodeMatch.map(d=>`<a href="#/admin-rider/${d.id}" class="flex items-center justify-between px-3 py-2 hover:bg-brand-50 text-sm">
      <div><span class="font-bold text-brand-700">${escapeHtml(d.delivery_partner_code||"")}</span> <span class="text-slate-600">— ${escapeHtml(d.profiles?.full_name||"")}</span></div>
      <span class="text-xs text-slate-400 capitalize">${d.status}</span>
    </a>`).join(""));

  // ── Standard name/ID searches ─────────────────────────────────────────
  const orderRows = computeOrderSummaryRows(a).filter(r=>
    r.key.toLowerCase().includes(q) || (r.customer||"").toLowerCase().includes(q) || (r.stores||"").toLowerCase().includes(q)
  ).slice(0,6);
  if (orderRows.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase">Orders</div>` +
    orderRows.map(r=>`<a href="${r.isMaster?'#/morder/'+r.masterId:'#/order/'+r.key}" class="block px-3 py-2 hover:bg-slate-50 text-sm">
      <span class="font-semibold">#${escapeHtml(r.key)}</span> — ${escapeHtml(r.customer)} • ${escapeHtml(r.stores)} • ${money(r.orderValue)}
    </a>`).join(""));

  const storeMatches = a.allStores.filter(s=>
    s.name.toLowerCase().includes(q) && !(s.store_code||"").toLowerCase().includes(q)
  ).slice(0,6);
  if (storeMatches.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase">Stores</div>` +
    storeMatches.map(s=>`<a href="#/admin-store/${s.id}" class="flex items-center justify-between px-3 py-2 hover:bg-slate-50 text-sm">
      <span>${escapeHtml(s.name)} <span class="text-xs text-slate-400">${escapeHtml(s.store_code||"")}</span></span>
      <span class="text-xs text-slate-400 capitalize">${s.status}</span>
    </a>`).join(""));

  const customerMatches = a.allCustomers.filter(c=>(c.full_name||"").toLowerCase().includes(q) || (c.phone||"").includes(q)).slice(0,6);
  if (customerMatches.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase">Customers</div>` +
    customerMatches.map(c=>`<a href="#/admin-customer/${c.id}" class="block px-3 py-2 hover:bg-slate-50 text-sm">
      ${escapeHtml(c.full_name)} <span class="text-xs text-slate-400">${escapeHtml(c.phone||"")}</span>
    </a>`).join(""));

  const dpMatches = a.allDp.filter(d=>
    (d.profiles?.full_name||"").toLowerCase().includes(q) && !(d.delivery_partner_code||"").toLowerCase().includes(q)
  ).slice(0,6);
  if (dpMatches.length) sections.push(`<div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase">Delivery Partners</div>` +
    dpMatches.map(d=>`<a href="#/admin-rider/${d.id}" class="flex items-center justify-between px-3 py-2 hover:bg-slate-50 text-sm">
      <span>${escapeHtml(d.profiles?.full_name||"")} <span class="text-xs text-slate-400">${escapeHtml(d.delivery_partner_code||"")}</span></span>
      <span class="text-xs text-slate-400 capitalize">${d.status}</span>
    </a>`).join(""));

  box.innerHTML = sections.length ? sections.join("") : `<div class="px-3 py-4 text-sm text-slate-400">No matches for "${escapeHtml(q)}"</div>`;
  box.classList.remove("hidden");
}

    const suggested = store?.commission_percent ?? 10;

function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function exportSettlementHistoryCsv(){
  const rows = [["Date","Order ID","Particular","Type","Pending Amount","TDS","TCS","Cash/Bank","Status","Total Settlement Amount"]];
  document.querySelectorAll("#settlement-history-tbody tr").forEach(tr=>{
    const cells = Array.from(tr.children).slice(0,10).map(td=>td.textContent.trim());
    if (cells.length) rows.push(cells);
  });
  csvDownload("townparcel_settlement_history.csv", rows);
}
function exportSettlementReportCsv(){
  const rows = [["Order","Date","Delivered","Customer","Customer Paid","Store Received","Store Commission","Delivery Partner Received","Delivery Partner Commission","Marketplace Fee","COD Fee","Platform Total Earning","Settlement","Balanced"]];
  document.querySelectorAll("#settlement-tbody tr").forEach(tr=>{
    rows.push(Array.from(tr.children).map(td=>td.textContent.trim()));
  });
  csvDownload("townparcel_settlement_report.csv", rows);
}

function viewAdminReports(){
  const a = state.admin;
  const today = new Date().toDateString();
  const thisMonth = new Date().getMonth();
  const dailyOrders = a.allMasterOrders.filter(m=>new Date(m.placed_at).toDateString()===today);
  const monthlyOrders = a.allMasterOrders.filter(m=>new Date(m.placed_at).getMonth()===thisMonth);
  const delivered = a.allOrders.filter(o=>o.status==="delivered"); // store-level (child orders)
  const deliveredMasters = a.allMasterOrders.filter(m=>m.status==="delivered");
  const totalSales = deliveredMasters.reduce((s,m)=>s+Number(m.total),0) + a.allOrders.filter(o=>o.status==="delivered" && !o.master_order_id).reduce((s,o)=>s+Number(o.total),0);
  const commission = delivered.reduce((s,o)=>s+Number(o.commission_amount),0);
  const cancelled = a.allMasterOrders.filter(m=>m.status==="cancelled").length + a.allOrders.filter(o=>o.status==="cancelled" && !o.master_order_id).length;
  const rejected = a.allOrders.filter(o=>o.status==="rejected").length;
  const pendingPay = a.allOrders.filter(o=>o.status==="delivered" && !o.store_paid_at).length + a.allMasterOrders.filter(m=>m.status==="delivered" && !m.delivery_paid_at && m.delivery_partner_id).length;
  const completedPay = a.allOrders.filter(o=>o.store_paid_at).length + a.allMasterOrders.filter(m=>m.delivery_paid_at).length;

  const byStore = {};
  delivered.forEach(o=>{ const k=o.stores?.name||"Unknown"; byStore[k]=(byStore[k]||0)+Number(o.subtotal); });
  const byPartner = {};
  deliveredMasters.forEach(m=>{ const k=m.delivery_partners?.profiles?.full_name; if(k) byPartner[k]=(byPartner[k]||0)+Number(m.delivery_partner_fee); });

  // Delivery / fee revenue metrics — master orders (multi-store) + legacy standalone orders (pre-dating multi-store)
  const standaloneDelivered = a.allOrders.filter(o=>o.status==="delivered" && !o.master_order_id);
  const standaloneAll = a.allOrders.filter(o=>!o.master_order_id);
  const totalDeliveryCharges = deliveredMasters.reduce((s,m)=>s+Number(m.delivery_charge),0) + standaloneDelivered.reduce((s,o)=>s+Number(o.delivery_charge||0),0);
  const totalMarketplaceFees = a.allMasterOrders.reduce((s,m)=>s+Number(m.marketplace_fee_amount||0),0) + standaloneAll.reduce((s,o)=>s+Number(o.marketplace_fee_amount||0),0);
  const totalCodFees = a.allMasterOrders.reduce((s,m)=>s+Number(m.cod_fee_amount||0),0) + standaloneAll.reduce((s,o)=>s+Number(o.cod_fee_amount||0),0);
  const totalDpCommission = deliveredMasters.reduce((s,m)=>s+Number(m.delivery_partner_commission||0),0) + standaloneDelivered.reduce((s,o)=>s+Number(o.delivery_partner_commission||0),0);
  const totalStoreCommission = delivered.reduce((s,o)=>s+Number(o.commission_amount),0);
  const totalStoreSettlements = a.allOrders.filter(o=>o.store_paid_at).reduce((s,o)=>s+Number(o.store_payout),0);
  const totalDpEarnings = deliveredMasters.reduce((s,m)=>s+Number(m.delivery_partner_fee),0) + standaloneDelivered.reduce((s,o)=>s+Number(o.delivery_partner_fee||0),0);
  const platformRevenue = totalStoreCommission + totalDpCommission + totalMarketplaceFees + totalCodFees;

  return `<div class="pt-6"><div id="print-stamp"></div><a href="#/admin-dashboard" class="text-sm text-slate-500 flex items-center gap-1 mb-3 no-print">${icon('back','w-4 h-4')} Back to Dashboard</a><div class="flex items-center justify-between"><h1 class="text-xl font-bold mb-4">Reports</h1><button onclick="printPage('Business Reports')" class="mb-4 px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold no-print">🖨 Print</button></div>${adminNav("#/admin-reports")}
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      ${statCard("Orders Today", dailyOrders.length, "receipt", "#/admin-master-orders")}
      ${statCard("Orders This Month", monthlyOrders.length, "receipt", "#/admin-master-orders")}
      ${statCard("Total Sales (Delivered)", money(totalSales), "wallet", "#/admin-master-orders")}
      ${statCard("Total Store Commissions", money(commission), "wallet", "#/admin-orders")}
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
      ${statCard("Cancelled Orders", cancelled, "x", "#/admin-orders")}
      ${statCard("Rejected Orders", rejected, "x", "#/admin-orders")}
      ${statCard("Pending Payouts", pendingPay, "wallet", "#/admin-settlements")}
      ${statCard("Completed Payouts", completedPay, "check", "#/admin-settlements")}
    </div>

    <h2 class="font-bold mt-6 mb-3">Delivery &amp; Fee Revenue</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      ${statCard("Total Delivery Charges", money(totalDeliveryCharges), "wallet", "#/admin-orders")}

      ${statCard("Total COD Fees", money(totalCodFees), "wallet", "#/admin-orders")}
      ${statCard("Total Delivery Partner Commissions", money(totalDpCommission), "wallet", "#/admin-orders")}
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
      ${statCard("Total Store Commissions", money(totalStoreCommission), "wallet", "#/admin-orders")}

      ${statCard("Platform Revenue", money(platformRevenue), "wallet", "#/admin-orders")}

function fyOf(dateStr){
  const d = new Date(dateStr);
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1; // Apr(3)-Mar FY
  return `${y}-${String((y+1)%100).padStart(2,'0')}`;
}

function localDateStr(d){
  const dt = d instanceof Date ? d : new Date(d);
  const yyyy = dt.getFullYear(), mm = String(dt.getMonth()+1).padStart(2,'0'), dd = String(dt.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

async function correctSettlementMethod(settlementLogId, currentMethod){
  const newMethod = currentMethod === "cash" ? "bank" : "cash";
  if (!confirm(`This was recorded as paid via ${currentMethod}. Change it to ${newMethod}? The money already moved correctly — this only fixes which column it shows up under.`)) return;
  try { await rpc("rpc_admin_correct_settlement_method", { p_settlement_log_id: settlementLogId, p_new_method: newMethod }); toast("Fixed"); await loadAdminData(); render(); }
  catch(e){ toast(e.message,"err"); }
}
async function reverseSettlement(settlementLogId){
  const reason = prompt("Why are you reversing this settlement? (required, e.g. \"paid wrong person\", \"COD never actually collected\")");
  if (!reason || reason.trim().length < 3) return toast("A reason is required to reverse a settlement","err");
  if (!confirm("This will pull the money back out of their wallet and re-open the order for a fresh payout. Continue?")) return;
  try { await rpc("rpc_admin_reverse_settlement", { p_settlement_log_id: settlementLogId, p_reason: reason.trim() }); toast("Settlement reversed"); await loadAdminData(); render(); }
  catch(e){ toast(e.message,"err"); }
}

  toast("Category rates updated");

async function viewStoreGstReport(){
  const delivered = state.orders.filter(o=>o.status==="delivered");
  const byMonth = {};
  delivered.forEach(o=>{
    const d = new Date(o.placed_at);
    const key = d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if (!byMonth[key]) byMonth[key] = { sortKey: d.getFullYear()*12+d.getMonth(), totalSales:0, taxableSales:0, gstCollected:0, orderCount:0, orders:[] };
    byMonth[key].totalSales += Number(o.subtotal||0);
    byMonth[key].orderCount += 1;

  const grandGst = delivered.reduce((s,o)=>s+Number(o.tax_amount||0),0);

      ${inventoryStatCard("GST Collected", money(grandGst), "wallet")}
    </div>

          <th class="p-3 text-right">Total Sales</th><th class="p-3 text-right">Taxable Sales</th><th class="p-3 text-right">GST Collected</th><th class="p-3"></th>
        </tr></thead>
        <tbody>${months.map(([label, m], idx)=>{
          const rows = [];
          rows.push(`<tr class="border-t border-slate-50 cursor-pointer hover:bg-slate-50" onclick="toggleGstMonth(${idx})">
            <td class="p-3 font-medium">${label}</td>
            <td class="p-3 text-right">${m.orderCount}</td>
            <td class="p-3 text-right">${money(m.totalSales)}</td>
            <td class="p-3 text-right">${money(m.taxableSales)}</td>
            <td class="p-3 text-right font-semibold text-brand-600">${money(m.gstCollected)}</td>
            <td class="p-3 text-right text-slate-400" id="gst-month-caret-${idx}">▾</td>
          </tr>`);
          const detailRows = [];
          m.orders.forEach(o=>{
            detailRows.push(`<tr class="border-t border-slate-50 bg-slate-50/60 text-[11px]">
              <td class="p-2 pl-4">${fmtDate(o.placed_at)}</td>
              <td class="p-2"><a href="javascript:void(0)" onclick="event.stopPropagation();printInvoice('${o.id}')" class="text-brand-600 underline font-medium">#${escapeHtml(o.order_number)}</a></td>
              <td class="p-2 text-right">${money(o.subtotal)}</td>
              <td class="p-2 text-right text-red-500">-${money(o.commission_amount)}</td>
              <td class="p-2 text-right text-brand-600">${Number(o.tax_amount)>0?'+'+money(o.tax_amount):'—'}</td>
              <td class="p-2 text-right font-semibold">${money(o.store_payout)}</td>
            </tr>`);
          });
          const monthInvoiceTotal = m.orders.reduce((s,o)=>s+Number(o.subtotal||0),0);
          const monthCommissionTotal = m.orders.reduce((s,o)=>s+Number(o.commission_amount||0),0);
          const monthGstTotal = m.orders.reduce((s,o)=>s+Number(o.tax_amount||0),0);
          const monthPlatformPaidTotal = m.orders.reduce((s,o)=>s+Number(o.store_payout||0),0);
          rows.push(`<tr id="gst-month-detail-${idx}" class="hidden"><td colspan="6" class="p-0">
            <div class="overflow-x-auto"><table class="w-full">
              <thead class="bg-slate-100 text-slate-500"><tr>
                <th class="p-2 pl-4 text-left text-[10px]">Date</th><th class="p-2 text-left text-[10px]">Order No</th><th class="p-2 text-right text-[10px]">Invoice Amount</th>
                <th class="p-2 text-right text-[10px]">Commission Deducted</th><th class="p-2 text-right text-[10px]">GST Collected</th><th class="p-2 text-right text-[10px]">Platform Paid</th>
              </tr></thead>
              <tbody>${detailRows.join("")}
                ${m.orders.length>1 ? `<tr class="border-t-2 border-slate-200 font-bold text-[11px]">
                  <td class="p-2 pl-4" colspan="2">Total</td>
                  <td class="p-2 text-right">${money(monthInvoiceTotal)}</td>
                  <td class="p-2 text-right text-red-500">-${money(monthCommissionTotal)}</td>
                  <td class="p-2 text-right text-brand-600">${monthGstTotal>0?'+'+money(monthGstTotal):'—'}</td>
                  <td class="p-2 text-right">${money(monthPlatformPaidTotal)}</td>
                </tr>` : ""}
              </tbody>
            </table></div>
          </td></tr>`);
          return rows.join("");

        ${months.length ? `<tr class="border-t-2 border-slate-200 font-bold"><td class="p-3">Total</td><td class="p-3 text-right">${delivered.length}</td><td class="p-3 text-right">${money(grandTotalSales)}</td><td class="p-3 text-right">${money(grandTaxable)}</td><td class="p-3 text-right text-brand-600">${money(grandGst)}</td><td></td></tr>` : ""}
        </tbody>
      </table>
    </div>
    <div class="text-[11px] text-slate-400 mt-3">GST rates are set per product category by TownParcel admin. Categories with a 0% rate (e.g. fresh produce) show no GST here, matching standard GST exemptions. Tap a month to see the order-by-order breakdown.</div>
  </div>`;
}
function toggleGstMonth(idx){
  const row = document.getElementById(`gst-month-detail-${idx}`);

  row.classList.toggle("hidden");

}

async function adminRemoveProduct(id, name){
  if (!confirm(`Permanently remove "${name}"? This can't be undone.`)) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if (error){
    if (error.code === "23503" || /foreign key/i.test(error.message)){
      toast(`Can't remove "${name}" — it's part of past order history. Use Hide instead to keep it off the store while preserving records.`,"err");
    } else {
      toast(error.message,"err");
    }
    return;
  }
  toast(`${name} removed`);
  render();
}
async function adminToggleProduct(id, makeAvailable){
  const { error } = await sb.from("products").update({ is_available: makeAvailable }).eq("id", id);
  if (error) return toast(error.message,"err");
  toast(makeAvailable ? "Product unhidden" : "Product hidden");
  render();
}

let adminIssuesFilter = { type: 'all', status: 'all' };

        <option value="delivery" ${adminIssuesFilter.type==='delivery'?'selected':''}>🟡 Delivery problem</option>
        <option value="payment" ${adminIssuesFilter.type==='payment'?'selected':''}>🔵 Payment problem</option>
      </select>
      <select onchange="adminIssuesFilter.status=this.value;render()" class="border border-slate-200 rounded-xl px-3 py-2 text-sm">

      <div class="flex justify-between items-start gap-3 mb-2">
        <div>
          <div class="text-sm font-semibold">${isResolved?'🟢 Resolved':info.dot} ${isResolved?'':info.label}</div>
          <div class="text-sm font-medium mt-1">${iss.master_orders?.master_order_number ? `Order #${escapeHtml(iss.master_orders.master_order_number)}` : iss.orders?.order_number ? `Order #${escapeHtml(iss.orders.order_number)}` : 'No order linked'}</div>
          <div class="text-xs text-slate-400">Reported by ${escapeHtml(iss.reporter?.full_name||"Unknown")} • ${fmtDate(iss.created_at)}</div>
        </div>
        ${!isResolved && iss.status==='in_progress' ? `<span class="text-[10px] font-semibold px-2 py-1 rounded-full shrink-0 bg-amber-50 text-amber-600">In Progress</span>` : ""}
      </div>
      <div class="text-sm text-slate-700 mb-3">${escapeHtml(iss.description||"")}</div>
      ${iss.status!=='resolved' ? `<div class="flex gap-2">
        ${iss.status==='open' ? `<button onclick="adminUpdateIssue('${iss.id}','in_progress')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-50 text-amber-600">Mark In Progress</button>` : ""}
        <button onclick="adminUpdateIssue('${iss.id}','resolved')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white">Mark Resolved</button>

async function adminUpdateIssue(id, status){
  const payload = { status };
  if (status === 'resolved'){ payload.resolved_at = new Date().toISOString(); payload.resolved_by = state.profile.id; }
  const { error } = await sb.from("delivery_issues").update(payload).eq("id", id);
  if (error) return toast(error.message,"err");
  toast("Issue updated");
  render();
}
